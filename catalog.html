<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { 
    margin: 0;
    padding: 0; 
    box-sizing: border-box; 
  }

  body {
    display: flex;
    flex-direction: column; 
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif; 
   
  }
  
  header {
    background: #1f1f30;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    flex: 1;
    background: linear-gradient(135deg, #3a3a5c, #2e4272, #1f5fa0, #7d4fb8);


  }
  
  .logo { color: #fff; font-size: 22px; font-weight: 700; }
  
  .burger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 5px;
  }
  
  .burger span {
    width: 26px;
    height: 3px;
    background: #fff;
    border-radius: 2px;
    transition: 0.3s;
  }
  
  .nav {
    display: flex;
    gap: 30px;
    list-style: none;
  }
  
  .nav a {
    color: #b8b8c8;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s;
    position: relative;
  }
  
  .nav a:hover { color: #667eea; }
  
  @media (max-width: 768px) {
    .burger { display: flex; }
    
    .nav {
      position: absolute;
      top: 70px;
      left: 0;
      right: 0;
      background: #16213e;
      flex-direction: column;
      padding: 20px;
      gap: 15px;
      transform: translateY(-150%);
      transition: transform 0.3s;
    }
    
    .nav.open { transform: translateY(0); }
    
    .burger.active span:nth-child(1) {
      transform: rotate(45deg) translate(6px, 6px);
    }
    .burger.active span:nth-child(2) { opacity: 0; }
    .burger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(6px, -6px);
    }
  }

  .label-form {
    display: flex;
    width: 100%;
    flex-direction: column;
    text-decoration: underline;
    align-items: center;
    padding: 5px 5px 10px 5px;
    margin-bottom: 10px;
    border-radius: 6px;
    border: 2px inset rgb(0, 0, 0);
    background-color: rgb(236, 236, 236);
  }

   .forma {
        display: flex;
        flex-direction: column;
        background-color: rgb(236, 236, 236);
        gap: 1rem;
        padding: 1rem;
        max-width: 40rem;
        align-items: left;
        justify-content: space-between;
        border-radius: 5px;
        border: 1px black solid;
        box-shadow: 8px 5px 8px rgba(119, 119, 119, 0.2);
    }

    .forma label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 5rem;
    }

    .forma input{
        padding: 0.4rem;
        width: 10rem;
        border-radius: 3px;
        border: 1px solid black;
    }

   button[type="submit"] {
    display: block;
    width: 60%;
    padding: 12px;
    margin: 20px auto 0 auto;
    margin-top: 20px;
    background-color: #2196F3;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

.wrapper_cards {
  background-color: gainsboro;
  display: flex;
  justify-content: center; /* Центрируем карточки */
  gap: 20px; /* Отступ между карточками */
  padding: 30px;
  border-radius: 12px;
  flex-wrap: wrap; /* Чтобы карточки переносились на новую строку на узких экранах */
  
  /* Исправленная тень для обертки */
  box-shadow: 0 4px 15px rgba(125, 79, 184, 0.3); 
}

.card {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 350px; /* Лучше min-height, чтобы контент не обрезался, если текст длинный */
  width: 200px;
  padding: 10px;
  background-color: palevioletred;
  border-radius: 12px; /* Скругленные углы */
  
  /* Тень для самой карточки, чтобы она "парела" */
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15); 
  
  /* Меняем цвет текста на белый для контраста с розовым фоном */
  color: #ffffff; 
  
  /* Плавная анимация при наведении */
  transition: transform 0.2s ease, box-shadow 0.2s ease; 
}

/* Эффект при наведении на карточку */
.card:hover {
  transform: translateY(-5px); /* Карточка немного приподнимается */
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
}

.card_foto {
  height: 200px;
  width: 180px;
  border-radius: 8px;
  overflow: hidden; /* Обрезаем картинку, если она вылезает за скругленные углы */
  background-color: #fff; /* Фон на случай, если картинка не загрузится */
  display: flex;
  align-items: center;
  justify-content: center;
}

.card_foto img {
  width: 100%;
  height: 100%;
  object-fit: contain; /* 👈 Changed from cover to contain */
  display: block;
}

.card_title {
  margin: 10px 0 5px 0;
  font-size: 20px;
  text-align: center;
}

.card_info {
  padding-top: 5px;
  font-size: 14px; /* Чуть уменьшил, чтобы текст смотрелся аккуратнее */
  color: #ffffff; /* Белый текст */
  text-align: center;
  line-height: 1.4; /* Межстрочный интервал для удобства чтения */
  margin: 0; /* Убираем стандартные отступы параграфа */
}
</style>
</head>
<body>
  <header>
    <div class="logo">MySite</div>
    <button class="burger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav" id="nav">
      <li><a href="#">Главная</a></li>
      <li><a href="#">Услуги</a></li>
      <li><a href="#">Портфолио</a></li>
      <li><a href="#">Контакты</a></li>
    </ul>
  </header>

<main>

<div class="wrapper_cards">
  
  <!-- Карточка 1 -->
  <div class="card">
    <div class="card_foto">
      <img src="1.png" alt="1 foto" title="1 foto">
    </div>

    <h2 class="card_title">Axe</h2>

    <div class="card_info">
      <p>This is a cool axe for enjoying your doing</p>
    </div>
  </div>

  <!-- Карточка2 -->
  <div class="card">
    <div class="card_foto">
      <img src="2.png" alt="2 foto" title="2 foto">
    </div>
    <h2 class="card_title">Pliers</h2>
    <div class="card_info">
      <p>That new pliers from Gamburg for You!</p>
    </div>
  </div>

</div>


  

</main>

  <script>
    function toggleMenu() {
      document.querySelector('.burger').classList.toggle('active');
      document.getElementById('nav').classList.toggle('open');
    }
  </script>
</body>
</html>
